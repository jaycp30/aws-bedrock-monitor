AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Bedrock usage & cost dashboard — BACKEND (SAM). Lambda + HTTP API (Cognito JWT
  auth) reading model-invocation LOGS for precise per-call tokens, live AWS
  pricing, Cost Explorer reconciliation, and a Guardrailed Bedrock "Ask" agent.
  The frontend is hosted separately by AWS Amplify Hosting (see amplify.yml);
  FrontendUrl wires Cognito callbacks + CORS to the Amplify app URL.

Parameters:
  Regions:
    Type: String
    Default: ap-northeast-1
    Description: >
      Comma-separated AWS regions to monitor. Sandbox = ap-northeast-1.
      Client = us-east-1,eu-west-1,us-west-2,ca-central-1,ap-southeast-2
  AdminEmail:
    Type: String
    Description: Email address to seed as the first dashboard user.
  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Model (inference profile) for the "Ask" agent; must exist in the stack region.
  FrontendUrl:
    Type: String
    Default: http://localhost:5173
    Description: >
      The Amplify Hosting app URL (no trailing slash), e.g.
      https://main.d123abc.amplifyapp.com. Used for Cognito callback/logout URLs
      and API CORS. Set this on the second deploy, once the Amplify app exists.

Globals:
  Function:
    Timeout: 90
    MemorySize: 512
    Runtime: python3.12

Resources:
  # ----------------------------------------------------------------------- #
  # Shared usage cache (S3) + async Ask job store (DynamoDB)
  # ----------------------------------------------------------------------- #
  UsageCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUsageCache
            Status: Enabled
            Prefix: usage/
            ExpirationInDays: 2
          - Id: ExpireCostCache
            Status: Enabled
            Prefix: cost/
            ExpirationInDays: 2

  AskJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ----------------------------------------------------------------------- #
  # Backend: metrics API + Ask agent
  # ----------------------------------------------------------------------- #
  UsageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Environment:
        Variables:
          REGIONS: !Ref Regions
          CORS_ORIGIN: !Ref FrontendUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ASK_MAX_TOKENS: "1600"
          USAGE_CACHE_TTL_SECONDS: "300"
          USAGE_STALE_TTL_SECONDS: "86400"
          USAGE_REGION_WORKERS: "5"
          USAGE_WARMUP_RANGES: "today,7d,30d,90d"
          USAGE_SHARED_CACHE_BUCKET: !Ref UsageCacheBucket
          # Billed (Cost Explorer) figure is recomputed at most once per 24 hours;
          # served from the shared S3 CE cache in between. Billing data only settles
          # a couple times a day, and the date-range cache key rolls daily anyway, so
          # 24h is the practical floor for CE API spend. See _billed_cost_by_region.
          CE_CACHE_TTL_SECONDS: "86400"
          ASK_JOBS_TABLE: !Ref AskJobsTable
          ASK_WORKER_FUNCTION: !Ref AskWorkerFunction
          ASK_JOB_TTL_SECONDS: "21600"
          GUARDRAIL_ID: !GetAtt UsageGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt UsageGuardrailVersion.Version
      Policies:
        - Statement:
            - Sid: ReadInvocationLogs
              Effect: Allow
              Action:
                - logs:FilterLogEvents
              Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/bedrock/model-invocations:*"
            - Sid: LivePricing
              Effect: Allow
              Action:
                - pricing:ListPriceLists
                - pricing:GetPriceListFileUrl
                - pricing:GetProducts
              Resource: "*"
            - Sid: BedrockCatalog
              Effect: Allow
              Action:
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
              Resource: "*"
            - Sid: BilledCost
              Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: "*"
            - Sid: SharedUsageCache
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${UsageCacheBucket.Arn}/usage/*"
                - !Sub "${UsageCacheBucket.Arn}/cost/*"
            - Sid: AskJobsApi
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AskJobsTable.Arn
            - Sid: AskWorkerInvoke
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt AskWorkerFunction.Arn
            - Sid: AskAgentInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: AskAgentGuardrail
              Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !GetAtt UsageGuardrail.GuardrailArn
      Events:
        GetUsage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /usage
            Method: GET
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ask
            Method: POST
        GetAskJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ask/{job_id}
            Method: GET
        UsageCacheWarmup:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)
            Enabled: true
            Input: '{"warmup":true}'

  # ----------------------------------------------------------------------- #
  # Async Ask worker — runs Bedrock Converse off the API request path so long
  # Ask calls never hit the HTTP API's 30s integration timeout.
  # ----------------------------------------------------------------------- #
  AskWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.ask_worker_handler
      Environment:
        Variables:
          REGIONS: !Ref Regions
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ASK_MAX_TOKENS: "1600"
          USAGE_CACHE_TTL_SECONDS: "300"
          USAGE_STALE_TTL_SECONDS: "86400"
          USAGE_REGION_WORKERS: "5"
          USAGE_WARMUP_RANGES: "today,7d,30d,90d"
          USAGE_SHARED_CACHE_BUCKET: !Ref UsageCacheBucket
          ASK_JOBS_TABLE: !Ref AskJobsTable
          ASK_JOB_TTL_SECONDS: "21600"
          GUARDRAIL_ID: !GetAtt UsageGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt UsageGuardrailVersion.Version
      Policies:
        - Statement:
            - Sid: ReadInvocationLogs
              Effect: Allow
              Action:
                - logs:FilterLogEvents
              Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/bedrock/model-invocations:*"
            - Sid: LivePricing
              Effect: Allow
              Action:
                - pricing:ListPriceLists
                - pricing:GetPriceListFileUrl
                - pricing:GetProducts
              Resource: "*"
            - Sid: BedrockCatalog
              Effect: Allow
              Action:
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
              Resource: "*"
            - Sid: BilledCost
              Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: "*"
            - Sid: SharedUsageCache
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${UsageCacheBucket.Arn}/usage/*"
                - !Sub "${UsageCacheBucket.Arn}/cost/*"
            - Sid: AskJobsWorker
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt AskJobsTable.Arn
            - Sid: AskAgentInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: AskAgentGuardrail
              Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !GetAtt UsageGuardrail.GuardrailArn

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ----------------------------------------------------------------------- #
  # Bedrock Guardrail — scopes the Ask agent to Bedrock usage/cost topics
  # ----------------------------------------------------------------------- #
  UsageGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-ask-guardrail"
      Description: Restricts the Ask agent to AWS Bedrock usage and cost questions.
      BlockedInputMessaging: "I can only help with questions about your AWS Bedrock usage and cost."
      BlockedOutputsMessaging: "I can only help with questions about your AWS Bedrock usage and cost."
      TopicPolicyConfig:
        # Several NARROW deny topics instead of one catch-all: narrow topics
        # classify far more accurately, and on-topic usage questions stop
        # competing with an overloaded definition. Each definition must stay
        # under 200 chars (classic-tier limit). Topical steering stays in the
        # system prompt in backend/ask.py.
        TopicsConfig:
          - Name: CreativeWriting
            Type: DENY
            # KNOWN LIMITATION (accepted for sandbox): the Claude model names
            # "Haiku" and "Sonnet" are poetry forms, so classic-tier topic
            # classification mis-reads cost questions that name them (e.g.
            # "is Haiku cheaper than Sonnet?") as creative writing and blocks
            # them. A reworded definition + explicit carve-out were tested via
            # apply-guardrail and did NOT fix it — the classic classifier can't
            # disambiguate the proper nouns. Workaround: phrase comparisons
            # without the names ("which model costs more per token"). Revisit
            # with standard-tier topics if name-based comparison matters.
            # See wiki QA-Hardening-Findings.md finding #12.
            Definition: >-
              Requests to write, compose, or generate creative content like
              poems, stories, jokes, songs, lyrics, fiction, or roleplay.
            Examples:
              - "Write me a poem."
              - "Tell me a joke."
              - "Write me a haiku about serverless."
          - Name: GeneralKnowledge
            Type: DENY
            Definition: >-
              Questions about world knowledge, trivia, history, geography,
              science, sports, or news that do not concern this AWS account's
              Bedrock usage, cost, or this dashboard.
            Examples:
              - "What's the capital of France?"
              - "Who won the World Cup?"
              - "How far away is the Moon?"
          - Name: CodingHelp
            Type: DENY
            Definition: >-
              Requests to write, debug, refactor, or review code or software
              that are not about interpreting this dashboard's Bedrock usage
              or cost data.
            Examples:
              - "Help me debug my Python script."
              - "Write a React component for me."
              - "Why does my SQL query fail?"
          - Name: PersonalAdvice
            Type: DENY
            Definition: >-
              Requests for personal recommendations or advice on health, legal,
              relationships, career, shopping, travel, or daily life.
            Examples:
              - "What should I eat for dinner?"
              - "Should I change jobs?"
              - "Plan my trip to Tokyo."
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM

  UsageGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt UsageGuardrail.GuardrailId
      # NOTE: GuardrailVersion only creates a NEW version when this resource is
      # REPLACED. Description is an immutable property, so bump it whenever the
      # Guardrail rules above change — otherwise the Lambda keeps the old version.
      Description: v4 — split into four narrow deny topics (2026-06-12).

  # ----------------------------------------------------------------------- #
  # Auth: Cognito (stays in SAM)
  # ----------------------------------------------------------------------- #
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UserPoolTags:
        Project: Bedrock-monitor
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          # Temporary (invite) passwords expire in 3 days, down from the 7-day default.
          TemporaryPasswordValidityDays: 3
      # Enforce TOTP (authenticator-app) MFA for every user. The Cognito Hosted UI
      # drives enrollment (QR code) + challenge natively, so the SPA needs no change.
      # SMS MFA is intentionally omitted (needs an SNS role, per-message cost, and the
      # us-east-1 SMS sandbox) — TOTP is stronger and free.
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        # Lets the access token call Cognito self-service APIs (GetUser,
        # ChangePassword) for the signed-in user only — used by the profile menu.
        - aws.cognito.signin.user.admin
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "${FrontendUrl}/"
      LogoutURLs:
        - !Sub "${FrontendUrl}/"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "bedrock-monitor-${AWS::AccountId}"

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

Outputs:
  ApiUrl:
    Description: Metrics API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoHostedUiDomain:
    Value: !Sub "https://bedrock-monitor-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  GuardrailId:
    Value: !GetAtt UsageGuardrail.GuardrailId
